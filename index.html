<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Лисёнок и огненный жёлудь</title>
<style>html,body{margin:0;height:100%;background:#0b0f14;overflow:hidden}canvas{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));touch-action:none}</style>
</head><body><canvas id="game" width="1280" height="720"></canvas>
<script>
// ================= ЧАСТЬ 1: ЯДРО ИГРЫ «Лисёнок и огненный жёлудь» =================
// ---------- 1. Константы и настройки ----------
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
const W = 1280, H = 720, TILE = 48, ROWS = 15, DT = 1 / 60, LEVEL_TIME = 300;
const HERO_W = 30, HERO_SMALL = 42, HERO_BIG = 84;
const PHYS = { walk: 260, run: 430, acc: 1500, airAcc: 1100, fric: 1700, skid: 3000,
  jump: 920, grav: 2300, cut: 2.6, maxFall: 960, coyote: 0.1, buffer: 0.12 };
const T = { EMPTY: 0, GROUND: 1, BRICK: 2, Q: 3, USED: 4, STONE: 5, STUMP: 6, HIDDEN: 7 };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const sign = v => v > 0 ? 1 : v < 0 ? -1 : 0;
function sfx(name) { if (typeof playSfx === 'function') playSfx(name); } // звук — часть 4

// ---------- 2. Карта уровня ----------
// . пусто  # земля  X камень  B кирпич  ? монета  M бонус (жёлудь/цветок)  T 10 монет  S звезда
// L скрытая жизнь  P пень  o монета  b жук  s улитка  h ёж  f хищный цветок (над пнём)
// - платформа ↔  ^ платформа ↕  C чекпоинт  F флаг  D вход в пещеру  E выход из пещеры
// I точка появления в пещере  O пень-выход в пещере. Строки зон выравниваются по низу (15 рядов).
const ZONE_A = [ // солнечная поляна
  '......................?................................',
  '.......................................................',
  '.......................................................',
  '.......................................................',
  '............?.......BMB?B.......................L......',
  '.......ooo..........................PP......PP.........',
  '............................PP......PP......PP.........',
  '..................b.........PP...b..PP..b.b.PP.........',
  '###################################################..##',
  '###################################################..##'];
const ZONE_B = [ // лес с пнями
  '........................BBSBB..........................',
  '.......................................................',
  '.......................................................',
  '..................................o....................',
  '....BTB..............D...?M?.....o.o..........E........',
  '.............f.......PP...............f.......PP.......',
  '.............PP......PP...............PP......PP.......',
  '.........s...PP..b.b.PP.......h.......PP..s.b.PP..C....',
  '#################################...###################',
  '#################################...###################'];
const ZONE_C = [ // обрыв с платформами
  '...........ooo...............................ooo.......',
  '.......X.............?M?............B?BB...............',
  '......XX.-.............................................',
  '.....XXX...................................-...........',
  '....XXXX............h....s...^......b.b................',
  '########.........###########......########.........####',
  '########.........###########......########.........####'];
const ZONE_D = [ // вечерний холм с финишем
  '....................?....................XX............',
  '........................................XXX............',
  '.......................................XXXX............',
  '......................................XXXXX............',
  '...?B?.........f...BMB...............XXXXXX............',
  '...............PP...................XXXXXXX............',
  '...............PP..................XXXXXXXX............',
  '......s........PP.h.........b.b.s.XXXXXXXXX....F.......',
  '##########...#########....#############################',
  '##########...#########....#############################'];
const CAVE = [ // бонусная пещера
  '############################',
  '#.I........................#',
  '#..........................#',
  '#..........................#',
  '#..........................#',
  '#..........................#',
  '#..........................#',
  '#..........................#',
  '#.......oooooooooo.........#',
  '#.......oooooooooo.....O...#',
  '#......BBBBBBBBBBBB....PP..#',
  '#......................PP..#',
  '#.......oooooooooo.....PP..#',
  '############################',
  '############################'];
const ZONES = [ZONE_A, ZONE_B, ZONE_C, ZONE_D];
const ZONE_W = 55, MAIN_W = ZONE_W * 4, CAVE_X = MAIN_W + 4, CAVE_W = 28, LW = CAVE_X + CAVE_W;

// ---------- 3. Мир: массивы и состояние игры ----------
const tiles = new Uint8Array(LW * ROWS);
const blocks = new Map(); // содержимое блоков: ключ tx+ty*LW -> {item:'coin'|'power'|'multi'|'star'|'life', n}
const enemies = [], items = [], fireballs = [], particles = [], platforms = [], floatTexts = [];
let checkpoint = { x: 0, y: 0, active: false };
let flag = { x: 0, topY: 0, baseY: 0, houseX: 0 };
let warp = { enter: null, exit: null, caveIn: null, caveOut: null };
const area = { name: 'main', x0: 0, x1: MAIN_W * TILE };
const cam = { x: 0, y: 0, look: 0 };
const game = { mode: 'menu', modeT: 0, frame: 0, score: 0, coins: 0, lives: 3, time: LEVEL_TIME,
  checkpoint: false, muted: false, demo: false, hiscore: 0, shake: 0, fade: 1, timeBonus: 0, flagBonus: 0 };
try { game.hiscore = +localStorage.getItem('foxAcornHi') || 0; } catch (e) { /* без хранилища */ }
function saveHiscore() {
  if (game.score <= game.hiscore) return false;
  game.hiscore = game.score;
  try { localStorage.setItem('foxAcornHi', String(game.hiscore)); } catch (e) { /* без хранилища */ }
  return true;
}
const hero = { power: 0 }; // power: 0 маленький, 1 большой, 2 огненный

// ---------- 4. Тайлы и разбор карты ----------
const bkey = (tx, ty) => tx + ty * LW;
function tileAt(tx, ty) {
  if (ty < 0 || ty >= ROWS) return T.EMPTY;
  if (tx < 0 || tx >= LW) return T.STONE;
  return tiles[ty * LW + tx];
}
function setTile(tx, ty, t) { if (tx >= 0 && tx < LW && ty >= 0 && ty < ROWS) tiles[ty * LW + tx] = t; }
function solidAt(tx, ty) { const t = tileAt(tx, ty); return t !== T.EMPTY && t !== T.HIDDEN; }
function zoneOf(x) { return x >= CAVE_X * TILE ? 4 : clamp(Math.floor(x / (ZONE_W * TILE)), 0, 3); }
function makeEnemy(type, cx, by) { // cx — центр по X, by — низ
  const S = { beetle: [40, 36, 60], snail: [42, 38, 45], hedgehog: [44, 36, 50], flower: [40, 60, 0] }[type];
  return { type, x: cx - S[0] / 2, y: by - S[1], w: S[0], h: S[1], speed: S[2], vx: 0, vy: 0, dir: -1,
    state: type === 'flower' ? 'hide' : 'walk', t: Math.random() * 3, baseY: by, rise: 0,
    alive: true, active: false, onGround: false, wall: 0, head: null };
}
function makePlatform(tx, ty, axis) {
  return { x: tx * TILE, y: ty * TILE + 6, w: TILE * 3, h: 20, x0: tx * TILE, y0: ty * TILE + 6, axis,
    range: axis === 'h' ? TILE * 5 : TILE * 4, t: 0, dx: 0, dy: 0 }; // 'h': вправо на range, 'v': вверх на range
}
function parseCell(ch, tx, ty) {
  const px = tx * TILE, py = ty * TILE, k = bkey(tx, ty);
  switch (ch) {
    case '#': setTile(tx, ty, T.GROUND); break;
    case 'X': setTile(tx, ty, T.STONE); break;
    case 'P': setTile(tx, ty, T.STUMP); break;
    case 'B': setTile(tx, ty, T.BRICK); break;
    case '?': setTile(tx, ty, T.Q); blocks.set(k, { item: 'coin' }); break;
    case 'M': setTile(tx, ty, T.Q); blocks.set(k, { item: 'power' }); break;
    case 'T': setTile(tx, ty, T.BRICK); blocks.set(k, { item: 'multi', n: 10 }); break;
    case 'S': setTile(tx, ty, T.BRICK); blocks.set(k, { item: 'star' }); break;
    case 'L': setTile(tx, ty, T.HIDDEN); blocks.set(k, { item: 'life' }); break;
    case 'o': items.push({ type: 'coin', x: px + 12, y: py + 8, w: 24, h: 32, vx: 0, vy: 0, fixed: true, t: tx * 0.3 }); break;
    case 'b': enemies.push(makeEnemy('beetle', px + 24, py + TILE)); break;
    case 's': enemies.push(makeEnemy('snail', px + 24, py + TILE)); break;
    case 'h': enemies.push(makeEnemy('hedgehog', px + 24, py + TILE)); break;
    case 'f': enemies.push(makeEnemy('flower', px + TILE, py + TILE)); break; // сидит в пне под собой
    case '-': platforms.push(makePlatform(tx, ty, 'h')); break;
    case '^': platforms.push(makePlatform(tx, ty, 'v')); break;
    case 'C': checkpoint = { x: px + 24, y: py + TILE, active: game.checkpoint }; break;
    case 'F': setTile(tx, ty, T.STONE);
      flag = { x: px + 24, topY: (ty - 9) * TILE, baseY: py, houseX: px + TILE * 4.5 }; break;
    case 'D': warp.enter = { x: px + TILE, y: py + TILE }; break;   // центр верха пня-входа
    case 'E': warp.exit = { x: px + TILE, y: py + TILE }; break;    // центр верха пня-выхода
    case 'O': warp.caveOut = { x: px + TILE, y: py + TILE }; break; // пень-выход в пещере
    case 'I': warp.caveIn = { x: px + 24, y: py }; break;           // откуда герой падает в пещеру
  }
}
function loadLevel() {
  tiles.fill(0); blocks.clear();
  enemies.length = items.length = fireballs.length = particles.length = platforms.length = floatTexts.length = 0;
  warp = { enter: null, exit: null, caveIn: null, caveOut: null };
  const put = (rows, x0, w) => {
    const off = ROWS - rows.length;
    rows.forEach((row, r) => {
      const s = row.padEnd(w, '.').slice(0, w);
      for (let c = 0; c < w; c++) parseCell(s[c], x0 + c, r + off);
    });
  };
  ZONES.forEach((z, i) => put(z, i * ZONE_W, ZONE_W));
  put(CAVE, CAVE_X, CAVE_W);
}

// ---------- 5. Столкновения с тайлами (общие для героя, врагов и бонусов) ----------
// После вызова: e.onGround, e.wall (-1/0/1), e.head ({tx,ty} блока, в который упёрлись головой)
function moveBody(e, dt) {
  e.wall = 0; e.head = null;
  e.x += e.vx * dt;
  const ya = Math.floor(e.y / TILE), yb = Math.floor((e.y + e.h - 0.01) / TILE);
  if (e.vx > 0) {
    const tx = Math.floor((e.x + e.w) / TILE);
    for (let ty = ya; ty <= yb; ty++) if (solidAt(tx, ty)) { e.x = tx * TILE - e.w; e.wall = 1; break; }
  } else if (e.vx < 0) {
    const tx = Math.floor(e.x / TILE);
    for (let ty = ya; ty <= yb; ty++) if (solidAt(tx, ty)) { e.x = (tx + 1) * TILE; e.wall = -1; break; }
  }
  e.y += e.vy * dt; e.onGround = false;
  const xa = Math.floor(e.x / TILE), xb = Math.floor((e.x + e.w - 0.01) / TILE);
  if (e.vy >= 0) {
    const ty = Math.floor((e.y + e.h) / TILE);
    for (let tx = xa; tx <= xb; tx++) if (solidAt(tx, ty)) { e.y = ty * TILE - e.h; e.vy = 0; e.onGround = true; break; }
  } else {
    const ty = Math.floor(e.y / TILE); let best = null, bd = 1e9;
    for (let tx = xa; tx <= xb; tx++) if (solidAt(tx, ty)) {
      const d = Math.abs((tx + 0.5) * TILE - (e.x + e.w / 2));
      if (d < bd) { bd = d; best = { tx, ty }; }
    }
    if (best) { e.y = (ty + 1) * TILE; e.vy = 0; e.head = best; }
  }
}

// ---------- 6. Частицы и всплывающие надписи (логика; отрисовка — часть 3) ----------
function spawnP(type, x, y, n, o) {
  o = o || {};
  for (let i = 0; i < n && particles.length < 500; i++) {
    const a = (o.ang !== undefined ? o.ang : -Math.PI / 2) + (Math.random() - 0.5) * (o.spread !== undefined ? o.spread : Math.PI * 2);
    const s = (o.speed || 120) * rnd(0.4, 1.2);
    particles.push({ type, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: o.g !== undefined ? o.g : 600,
      life: 0, max: (o.life || 0.6) * rnd(0.6, 1.2), size: (o.size || 6) * rnd(0.6, 1.4),
      color: o.color || '#fff', rot: Math.random() * 6.28, vr: rnd(-5, 5) });
  }
}
function updateFx(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life += dt;
    if (p.life >= p.max) { particles.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i]; f.t += dt; f.y -= 45 * dt;
    if (f.t > 1) floatTexts.splice(i, 1);
  }
}

// ---------- 7. Очки, монеты, жизни, режимы ----------
function setMode(m) { game.mode = m; game.modeT = 0; }
function addScore(n, x, y) { game.score += n; if (x !== undefined) floatTexts.push({ x, y, text: String(n), t: 0 }); }
function addLife(x, y) { game.lives++; sfx('life'); if (x !== undefined) floatTexts.push({ x, y, text: '1UP', t: 0 }); }
function addCoin(x, y) {
  game.coins++; game.score += 200; sfx('coin');
  if (game.coins >= 100) { game.coins -= 100; addLife(x, y); }
}
function setArea(name) {
  area.name = name;
  if (name === 'cave') { area.x0 = CAVE_X * TILE; area.x1 = LW * TILE; } else { area.x0 = 0; area.x1 = MAIN_W * TILE; }
  cam.look = 0; cam.x = clamp(hero.x + hero.w / 2 - W * 0.42, area.x0, area.x1 - W);
}
function placeHero(cx, footY) {
  const hh = hero.power > 0 ? HERO_BIG : HERO_SMALL;
  Object.assign(hero, { x: cx - HERO_W / 2, y: footY - hh, w: HERO_W, h: hh, vx: 0, vy: 0, dir: 1,
    onGround: false, wall: 0, head: null, coyote: 0, jumpBuf: 0, inv: 0, star: 0, crouch: false, skid: false,
    state: 'normal', stateT: 0, t: 0, runPhase: 0, combo: 0, ride: null, fireCd: 0, grow: 0, growFrom: 0, landT: 0 });
}
function resetLevel(fromCheckpoint) {
  loadLevel();
  game.time = LEVEL_TIME; game.fade = 1; game.timeBonus = 0; game.flagBonus = 0;
  hero.power = 0;
  placeHero(fromCheckpoint && game.checkpoint ? checkpoint.x : 3.5 * TILE, 13 * TILE);
  setArea('main');
}
function newGame(demo) {
  game.score = 0; game.coins = 0; game.lives = 3; game.checkpoint = false; game.demo = !!demo;
  resetLevel(false); setMode('play');
}
function togglePause() {
  if (game.mode === 'play' && !game.demo) setMode('pause'); else if (game.mode === 'pause') setMode('play');
}

// ---------- 8. Ввод: клавиатура и сенсорные кнопки ----------
const keys = {};
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump',
  Space: 'jump', ArrowDown: 'down', KeyS: 'down', ShiftLeft: 'run', ShiftRight: 'run', KeyX: 'fire', KeyF: 'fire' };
const input = { left: false, right: false, down: false, jump: false, run: false, fire: false,
  jumpPressed: false, firePressed: false, downPressed: false };
let isTouch = false; // часть 4 рисует touchBtns, если true
const touchBtns = [
  { id: 'left', x: 90, y: 625, r: 56, on: false }, { id: 'right', x: 235, y: 625, r: 56, on: false },
  { id: 'down', x: 162, y: 520, r: 46, on: false }, { id: 'jump', x: 1185, y: 610, r: 64, on: false },
  { id: 'fire', x: 1045, y: 645, r: 54, on: false }, { id: 'pause', x: 1235, y: 115, r: 30, on: false }];
window.addEventListener('keydown', e => {
  if (KEYMAP[e.code]) e.preventDefault();
  if (e.repeat) return;
  if (typeof onAnyKey === 'function' && onAnyKey(e.code)) return; // часть 4: меню/демо/экраны; true = клавиша поглощена
  keys[e.code] = true;
  if (e.code === 'KeyM') { game.muted = !game.muted; if (typeof applyMute === 'function') applyMute(); }
  if (e.code === 'KeyP') togglePause();
  if (e.code === 'KeyR' && game.mode !== 'menu') newGame(false);
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; for (const b of touchBtns) b.on = false; });
function touchPos(t) { // экранные координаты -> логические 1280×720 (с учётом полей)
  const r = canvas.getBoundingClientRect(), s = Math.min(r.width / W, r.height / H);
  return { x: (t.clientX - r.left - (r.width - W * s) / 2) / s, y: (t.clientY - r.top - (r.height - H * s) / 2) / s };
}
function onTouch(e) {
  e.preventDefault(); isTouch = true;
  for (const b of touchBtns) b.on = false;
  for (const t of e.touches) {
    const p = touchPos(t);
    for (const b of touchBtns) if (Math.hypot(p.x - b.x, p.y - b.y) < b.r * 1.25) b.on = true;
  }
  if (e.type === 'touchstart') {
    if (typeof onAnyKey === 'function' && onAnyKey('Touch')) { for (const b of touchBtns) b.on = false; return; }
    const pb = touchBtns[5];
    for (const t of e.changedTouches) { const p = touchPos(t); if (Math.hypot(p.x - pb.x, p.y - pb.y) < pb.r * 1.4) togglePause(); }
  }
}
['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(n => canvas.addEventListener(n, onTouch, { passive: false }));
canvas.addEventListener('mousedown', () => { if (typeof onAnyKey === 'function') onAnyKey('Mouse'); });
function readInput() { // раз в шаг физики; в демо управление отдаёт botInput(input) из части 4
  const pj = input.jump, pf = input.fire, pd = input.down;
  input.left = input.right = input.down = input.jump = input.run = input.fire = false;
  if (game.demo && typeof botInput === 'function') botInput(input);
  else {
    for (const c in KEYMAP) if (keys[c]) input[KEYMAP[c]] = true;
    for (const b of touchBtns) if (b.on && b.id !== 'pause') { input[b.id] = true; if (b.id === 'fire') input.run = true; }
  }
  input.jumpPressed = input.jump && !pj; input.firePressed = input.fire && !pf; input.downPressed = input.down && !pd;
}

// ---------- 9. Герой: состояния, урон, физика ----------
function setHeroH(nh) { hero.y += hero.h - nh; hero.h = nh; }
function heroFits(hh) { // поместится ли герой высотой hh (ноги на месте)
  const top = hero.y + hero.h - hh;
  for (let ty = Math.floor(top / TILE); ty <= Math.floor((hero.y + hero.h - 1) / TILE); ty++)
    for (let tx = Math.floor(hero.x / TILE); tx <= Math.floor((hero.x + hero.w - 0.01) / TILE); tx++)
      if (solidAt(tx, ty)) return false;
  return true;
}
function setPower(p) { // 0 маленький, 1 большой, 2 огненный
  hero.growFrom = hero.power; hero.power = p; hero.grow = 0.6;
  setHeroH(p > 0 && !hero.crouch ? HERO_BIG : HERO_SMALL);
}
function hurtHero() { // урон: на ступень ниже + неуязвимость; маленький теряет жизнь
  if (hero.state !== 'normal' || hero.inv > 0 || hero.star > 0) return;
  if (hero.power > 0) { setPower(hero.power - 1); hero.inv = 2; game.shake = 8; sfx('hurt'); }
  else killHero();
}
function killHero() {
  if (hero.state === 'dead') return;
  hero.power = 0; hero.crouch = false; setHeroH(HERO_SMALL);
  hero.state = 'dead'; hero.stateT = 0; hero.vx = 0; hero.vy = -820; hero.star = 0; hero.inv = 0; hero.ride = null;
  game.shake = 10; sfx('die');
}
function afterDeath() {
  game.lives--;
  if (game.lives <= 0) { saveHiscore(); setMode('over'); } else resetLevel(true);
}
function updateHero(dt) {
  const h = hero; h.t += dt;
  if (h.inv > 0) h.inv -= dt;
  if (h.star > 0) h.star -= dt;
  if (h.fireCd > 0) h.fireCd -= dt;
  if (h.grow > 0) h.grow -= dt;
  if (h.landT > 0) h.landT -= dt;
  if (h.state === 'dead') { // подпрыгнул и упал за экран
    h.stateT += dt;
    if (h.stateT > 0.45) { h.vy = Math.min(h.vy + PHYS.grav * dt, PHYS.maxFall); h.y += h.vy * dt; }
    if (h.stateT > 2.4) afterDeath();
    return;
  }
  if (h.state !== 'normal') return; // 'pipe' | 'flag' | 'win' — сценки ведёт часть 2
  const wasGround = h.onGround;
  // приседание и высота хитбокса
  const wantCrouch = input.down && h.onGround;
  if (h.power > 0) {
    const low = wantCrouch || (h.h === HERO_SMALL && !heroFits(HERO_BIG));
    h.crouch = low;
    if (low && h.h !== HERO_SMALL) setHeroH(HERO_SMALL);
    if (!low && h.h !== HERO_BIG) setHeroH(HERO_BIG);
  } else h.crouch = wantCrouch;
  // горизонталь: плавный разгон, инерция, торможение с пылью
  const move = (h.crouch && h.onGround) ? 0 : (input.right ? 1 : 0) - (input.left ? 1 : 0);
  const max = input.run ? PHYS.run : PHYS.walk;
  h.skid = false;
  if (move) {
    h.dir = move;
    if (h.vx * move < 0) {
      h.vx += move * PHYS.skid * dt;
      if (h.onGround && Math.abs(h.vx) > 90) {
        h.skid = true;
        if (game.frame % 3 === 0) spawnP('dust', h.x + h.w / 2, h.y + h.h, 1, { speed: 60, spread: 1.2, g: -40, life: 0.45, size: 9, color: '#e9dcc0' });
      }
    } else if (Math.abs(h.vx) <= max) h.vx = clamp(h.vx + move * (h.onGround ? PHYS.acc : PHYS.airAcc) * dt, -max, max);
    else h.vx -= move * PHYS.fric * 0.5 * dt;
  } else if (h.onGround) {
    const f = PHYS.fric * dt;
    h.vx = Math.abs(h.vx) <= f ? 0 : h.vx - sign(h.vx) * f;
  }
  h.runPhase += Math.abs(h.vx) * dt * 0.05;
  // прыжок: койот-тайм, буфер, высота по длительности нажатия
  h.coyote = h.onGround ? PHYS.coyote : h.coyote - dt;
  h.jumpBuf = input.jumpPressed ? PHYS.buffer : h.jumpBuf - dt;
  if (h.jumpBuf > 0 && h.coyote > 0) {
    h.vy = -(PHYS.jump + Math.abs(h.vx) * 0.12);
    h.jumpBuf = 0; h.coyote = 0; h.onGround = false; h.ride = null; sfx('jump');
  }
  h.vy = Math.min(h.vy + PHYS.grav * ((h.vy < 0 && !input.jump) ? PHYS.cut : 1) * dt, PHYS.maxFall);
  // движущаяся платформа несёт героя (платформы уже сдвинуты в updateWorld, их шаг — p.dx, p.dy)
  const ride = h.ride; h.ride = null;
  if (ride) { h.x += ride.dx; h.y = ride.y - h.h; }
  const prevY = h.y, prevB = h.y + h.h, vy0 = h.vy;
  moveBody(h, dt);
  if (h.vy >= 0) for (const p of platforms) {
    if (h.x + h.w > p.x + 2 && h.x < p.x + p.w - 2 && prevB <= p.y + 8 && h.y + h.h >= p.y - 1) {
      h.y = p.y - h.h; h.vy = 0; h.onGround = true; h.ride = p; break;
    }
  }
  // скрытый блок: твёрдый только при ударе головой снизу
  if (vy0 < 0 && !h.head) {
    const ty = Math.floor(h.y / TILE), tx = Math.floor((h.x + h.w / 2) / TILE);
    if (tileAt(tx, ty) === T.HIDDEN && prevY >= (ty + 1) * TILE - 1) { h.y = (ty + 1) * TILE; h.vy = 0; h.head = { tx, ty }; }
  }
  if (h.head && typeof bumpBlock === 'function') bumpBlock(h.head.tx, h.head.ty, h); // часть 2
  // границы области
  if (h.x < area.x0) { h.x = area.x0; if (h.vx < 0) h.vx = 0; }
  if (h.x > area.x1 - h.w) { h.x = area.x1 - h.w; if (h.vx > 0) h.vx = 0; }
  if (h.onGround) {
    if (!wasGround) {
      h.landT = 0.15;
      spawnP('dust', h.x + h.w / 2, h.y + h.h, 4, { speed: 70, spread: 2.6, g: -30, life: 0.4, size: 8, color: '#e9dcc0' });
    }
    h.combo = 0; // серия прыжков по врагам обрывается на земле
  }
  if (input.firePressed && h.power === 2 && !h.crouch && typeof shootFire === 'function') shootFire(); // часть 2
  if (h.y > H + 80) killHero(); // яма
}

// ---------- 10. Камера с мягким следованием ----------
function updateCamera(dt) {
  if (hero.state === 'dead') return;
  cam.look += (hero.dir * 70 - cam.look) * Math.min(1, dt * 2);
  const target = clamp(hero.x + hero.w / 2 - W * 0.42 + cam.look, area.x0, area.x1 - W);
  cam.x += (target - cam.x) * Math.min(1, dt * 6);
  cam.x = clamp(cam.x, area.x0, area.x1 - W);
}

// ---------- 11. Игровой цикл с фиксированным шагом ----------
// Порядок шага: updateWorld (часть 2: платформы, блоки, враги, бонусы, сценки) -> герой -> камера -> эффекты.
function step(dt) {
  game.frame++; game.modeT += dt;
  readInput();
  if (game.mode === 'play') {
    if (typeof updateWorld === 'function') updateWorld(dt);
    updateHero(dt);
    updateCamera(dt);
    if (hero.state === 'normal') {
      game.time -= dt;
      if (game.time <= 0) { game.time = 0; killHero(); }
    }
  }
  if (game.mode !== 'pause') updateFx(dt);
  if (typeof updateMeta === 'function') updateMeta(dt); // часть 4: меню, демо-таймер, музыка
  game.shake = Math.max(0, game.shake - dt * 30);
  game.fade = Math.max(0, game.fade - dt * 2);
}
let lastT = 0, accT = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastT) lastT = ts;
  accT += Math.min(0.1, (ts - lastT) / 1000); lastT = ts;
  let n = 0;
  while (accT >= DT && n < 5) { step(DT); accT -= DT; n++; }
  if (n === 5) accT = 0;
  if (typeof renderFrame === 'function') renderFrame(); // часть 3
}
resetLevel(false); // мир готов для меню; цикл запускается последней строкой части 4

// ================= ЧАСТЬ 2: МИР — блоки, бонусы, враги, огоньки, платформы, сценки =================
// Памятка для частей 3–4:
//  bumpOffset(tx,ty) — сдвиг блока по Y при ударе; flagClothY() — высота полотнища флага;
//  items: type coin|acorn|flower|star|life, state 'rise' (выезжает из блока — рисовать ПОД тайлами) | 'move';
//  enemies: state walk|squash|shell|slide|dead (dead — рисовать перевёрнутым), цветок: hide|rise|up|sink, e.rise 0..1
//           (рисовать с обрезкой по e.baseY — верх пня);
//  hero.state 'pipe': обрезать героя по scene.pipe.clipY; 'flag' — держится за шест; 'win': scene.phase 0 идёт, 1–2 победная поза;
//  частицы: dust, shard, spark, coinpop, rainbow, leaf, firefly;
//  звуки sfx: jump bump break coin sprout power star life stomp kick fire pipe checkpoint flag win tick hurt die.

// ---------- 1. Общие помощники и состояние сценок ----------
const scene = { pipe: null, flagY: 0, phase: 0, t: 0 };
const bumpAnim = new Map(); // ключ блока -> оставшееся время подпрыгивания
const BUMP_T = 0.18;
const COMBO = [100, 200, 400, 800, 1000, 2000, 4000, 8000];
const ITEM_SPEED = { acorn: 120, life: 140, star: 180, flower: 0 };
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const onScreen = (e, m) => e.x + e.w > cam.x - m && e.x < cam.x + W + m;
function bumpOffset(tx, ty) {
  const t = bumpAnim.get(bkey(tx, ty));
  return t ? -Math.sin((1 - t / BUMP_T) * Math.PI) * 14 : 0;
}
function flagClothY() { return hero.state === 'flag' || hero.state === 'win' ? scene.flagY : flag.topY + 8; }
function comboScore(n, x, y) { if (n >= COMBO.length) addLife(x, y); else addScore(COMBO[n], x, y); }

// ---------- 2. Блоки и удары по ним ----------
function popCoin(x, y) { // монетка, вылетающая из блока (только эффект)
  particles.push({ type: 'coinpop', x, y: y - 10, vx: 0, vy: -640, g: 1900, life: 0, max: 0.6, size: 15,
    color: '#ffd23e', rot: 0, vr: 14 });
}
function spawnItem(type, tx, ty) { // бонус выезжает из блока вверх
  items.push({ type, x: tx * TILE + 6, y: ty * TILE + 4, w: 36, h: 36, vx: 0, vy: 0, fixed: false, t: 0,
    state: 'rise', riseY: ty * TILE - 36, dir: 1, onGround: false, wall: 0, head: null });
  sfx('sprout');
}
function knockAbove(tx, ty) { // подбросить всё, что стоит на блоке
  const x0 = tx * TILE, top = ty * TILE;
  for (const e of enemies) {
    if (!e.alive || e.type === 'flower' || e.state === 'dead') continue;
    if (e.x + e.w > x0 && e.x < x0 + TILE && Math.abs(e.y + e.h - top) < 6)
      killEnemy(e, e.x + e.w / 2 < x0 + 24 ? -1 : 1, 100);
  }
  for (const it of items) {
    if (it.gone || it.state === 'rise' || it.x + it.w <= x0 || it.x >= x0 + TILE) continue;
    if (Math.abs(it.y + it.h - top) > 10) continue;
    if (it.fixed) { collectItem(it); popCoin(it.x + it.w / 2, it.y + 20); it.gone = true; }
    else { it.vy = -480; it.dir = it.x + it.w / 2 < x0 + 24 ? -1 : 1; }
  }
}
function bumpBlock(tx, ty, h) { // вызывается из updateHero при ударе головой
  const t = tileAt(tx, ty), k = bkey(tx, ty), b = blocks.get(k), cx = (tx + 0.5) * TILE, top = ty * TILE;
  if (t !== T.BRICK && t !== T.Q && t !== T.HIDDEN) { if (t === T.USED || t === T.STONE) sfx('bump'); return; }
  knockAbove(tx, ty);
  if (!b) { // обычный кирпич: большой разбивает, маленький подталкивает
    if (h.power > 0) {
      setTile(tx, ty, T.EMPTY); bumpAnim.delete(k);
      spawnP('shard', cx, top + 24, 8, { speed: 400, spread: 1.9, g: 1500, life: 0.9, size: 12, color: '#c8703a' });
      addScore(50); game.shake = Math.max(game.shake, 5); sfx('break');
    } else { bumpAnim.set(k, BUMP_T); sfx('bump'); }
    return;
  }
  bumpAnim.set(k, BUMP_T); sfx('bump');
  if (b.item === 'coin' || b.item === 'multi') {
    addCoin(cx, top - 20); popCoin(cx, top);
    if (b.item === 'multi' && --b.n > 0) return; // блок с десятью монетами ещё не пуст
  } else if (b.item === 'power') spawnItem(h.power > 0 ? 'flower' : 'acorn', tx, ty);
  else spawnItem(b.item, tx, ty); // star | life
  blocks.delete(k); setTile(tx, ty, T.USED);
}

// ---------- 3. Бонусы и монеты ----------
function collectItem(it) {
  const x = it.x + it.w / 2, y = it.y;
  if (it.type === 'coin') {
    addCoin(x, y);
    spawnP('spark', x, y + 16, 5, { speed: 90, life: 0.35, size: 5, color: '#fff3a0', g: 0 });
    return;
  }
  if (it.type === 'life') { addLife(x, y); return; }
  addScore(1000, x, y);
  spawnP('spark', x, y + 18, 10, { speed: 170, life: 0.5, size: 6, color: '#ffe680', g: 100 });
  if (it.type === 'star') { hero.star = 10; sfx('star'); return; }
  const p = it.type === 'flower' ? 2 : 1;
  if (hero.power < p) { setPower(p); if (!heroFits(hero.h)) setHeroH(HERO_SMALL); }
  sfx('power');
}
function updateItems(dt) {
  const h = hero;
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i]; it.t += dt;
    if (it.gone) { items.splice(i, 1); continue; }
    if (it.state === 'rise') {
      it.y -= 70 * dt;
      if (it.y <= it.riseY) { it.y = it.riseY; it.state = 'move'; }
      continue;
    }
    if (!it.fixed) { // жёлудь и жизнь катятся, звезда скачет, цветок стоит
      it.vx = it.dir * ITEM_SPEED[it.type];
      it.vy = Math.min(it.vy + PHYS.grav * (it.type === 'star' ? 0.55 : 1) * dt, PHYS.maxFall);
      moveBody(it, dt);
      if (it.wall) it.dir = -it.wall;
      if (it.type === 'star' && it.onGround) it.vy = -600;
      if (it.y > H + 100) { items.splice(i, 1); continue; }
    }
    if (h.state === 'normal' && overlap(h, it)) { collectItem(it); items.splice(i, 1); }
  }
}

// ---------- 4. Враги ----------
function killEnemy(e, dx, pts) { // сбит огоньком, раковиной, звездой или ударом по блоку
  if (!e.alive || e.state === 'dead') return;
  const cx = e.x + e.w / 2;
  addScore(pts, cx, e.y - 10); sfx('kick');
  spawnP('spark', cx, e.y + e.h / 2, 6, { speed: 170, life: 0.4, size: 6, color: '#ffe680', g: 200 });
  if (e.type === 'flower') {
    e.alive = false;
    spawnP('leaf', cx, e.y + 10, 8, { speed: 200, life: 0.8, size: 9, color: '#5fbf4a', g: 700 });
    return;
  }
  e.state = 'dead'; e.t = 0; e.vx = (dx || 1) * 150; e.vy = -520;
}
function updateFlower(e, dt) { // хищный цветок выглядывает из пня; не вылезает, если герой рядом
  e.t += dt;
  const near = Math.abs(hero.x + hero.w / 2 - (e.x + e.w / 2)) < 84;
  if (e.state === 'hide') { e.rise = 0; if (e.t > 1.6 && !near) { e.state = 'rise'; e.t = 0; } }
  else if (e.state === 'rise') { e.rise = Math.min(1, e.t / 0.6); if (e.rise >= 1) { e.state = 'up'; e.t = 0; } }
  else if (e.state === 'up') { if (e.t > 1.5) { e.state = 'sink'; e.t = 0; } }
  else { e.rise = Math.max(0, 1 - e.t / 0.6); if (e.rise <= 0) { e.state = 'hide'; e.t = 0; } }
  e.y = e.baseY - e.rise * e.h;
}
function updateWalker(e, dt) { // жук, улитка (и её раковина), ёж
  e.t += dt;
  if (e.kickT > 0) e.kickT -= dt;
  if (e.state === 'squash') { if (e.t > 0.45) e.alive = false; return; }
  if (e.state === 'dead') {
    e.vy += PHYS.grav * dt; e.x += e.vx * dt; e.y += e.vy * dt;
    if (e.y > H + 120) e.alive = false;
    return;
  }
  if (e.state === 'shell') { e.vx = 0; if (e.t > 7) { e.state = 'walk'; e.t = 0; } } // улитка вылезает обратно
  else if (e.state === 'slide') e.vx = e.dir * 540;
  else e.vx = e.dir * e.speed;
  e.vy = Math.min(e.vy + PHYS.grav * dt, PHYS.maxFall);
  moveBody(e, dt);
  if (e.wall) {
    e.dir = -e.wall;
    if (e.state === 'slide' && onScreen(e, 0)) sfx('bump');
  } else if (e.state === 'walk' && e.onGround) { // разворот у края обрыва
    const fx = e.dir > 0 ? e.x + e.w + 1 : e.x - 1;
    if (!solidAt(Math.floor(fx / TILE), Math.floor((e.y + e.h + 2) / TILE))) e.dir = -e.dir;
  }
  if (e.y > H + 120 || (e.state === 'slide' && !onScreen(e, W))) e.alive = false;
}
function heroVsEnemy(e, falling) {
  const h = hero;
  if (e.state === 'dead' || e.state === 'squash' || !overlap(h, e)) return;
  const cx = e.x + e.w / 2;
  if (e.type === 'flower') {
    if (e.rise < 0.2) return;
    if (h.star > 0) killEnemy(e, h.dir, 200); else hurtHero();
    return;
  }
  if (h.star > 0) { killEnemy(e, h.dir, 200); return; }
  if (e.kickT > 0) return; // короткая пауза после прыжка/пинка, чтобы не задеть себя
  const above = falling && h.y + h.h < e.y + e.h * 0.75;
  if (e.state === 'shell') { // пинок неподвижной раковины
    e.state = 'slide'; e.dir = h.x + h.w / 2 < cx ? 1 : -1; e.kickT = 0.3; e.combo = 0;
    if (above) h.vy = -420;
    addScore(400, cx, e.y - 10); sfx('kick');
    return;
  }
  if (above && e.type !== 'hedgehog') { // прыжок сверху
    if (e.type === 'beetle') e.state = 'squash'; else { e.state = 'shell'; e.kickT = 0.25; }
    e.t = 0; e.vx = 0;
    h.vy = input.jump ? -800 : -520;
    comboScore(h.combo++, cx, e.y - 10);
    sfx('stomp'); game.shake = Math.max(game.shake, 3);
    spawnP('dust', cx, e.y + e.h, 5, { speed: 90, spread: 2.8, g: -20, life: 0.4, size: 8, color: '#e9dcc0' });
    return;
  }
  hurtHero(); // касание сбоку, ёж или летящая раковина
}
function updateEnemies(dt) {
  const h = hero, falling = h.vy > 60;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (!e.alive) { enemies.splice(i, 1); continue; }
    if (e.type === 'flower') updateFlower(e, dt);
    else {
      if (!e.active) { if (onScreen(e, 90)) e.active = true; else continue; }
      updateWalker(e, dt);
    }
    if (e.alive && h.state === 'normal') heroVsEnemy(e, falling);
  }
  // враги между собой: раковина сбивает, остальные разворачиваются
  const ok = e => e.alive && e.active && e.type !== 'flower' && e.state !== 'dead' && e.state !== 'squash';
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    if (!ok(a)) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j];
      if (!ok(b) || !overlap(a, b)) continue;
      if (a.state === 'slide' || b.state === 'slide') {
        const s = a.state === 'slide' ? a : b, v = s === a ? b : a;
        s.combo = (s.combo || 0) + 1;
        killEnemy(v, s.dir, COMBO[Math.min(s.combo, COMBO.length - 1)]);
        if (a.state === 'dead') break;
      } else { a.dir = a.x < b.x ? -1 : 1; b.dir = -a.dir; }
    }
  }
}

// ---------- 5. Огоньки ----------
function shootFire() { // вызывается из updateHero; не больше двух на экране
  const h = hero;
  if (fireballs.length >= 2 || h.fireCd > 0) return;
  fireballs.push({ x: h.x + h.w / 2 + h.dir * 14 - 8, y: h.y + h.h * 0.35, w: 16, h: 16, vx: h.dir * 640, vy: 120,
    t: 0, onGround: false, wall: 0, head: null });
  h.fireCd = 0.22; sfx('fire');
}
function updateFireballs(dt) {
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const f = fireballs[i]; f.t += dt;
    f.vy = Math.min(f.vy + 2400 * dt, 700);
    moveBody(f, dt);
    let boom = f.wall !== 0 || f.head !== null;
    if (f.onGround) f.vy = -420; // прыгает по земле
    for (const e of enemies) {
      if (!e.alive || e.state === 'dead' || e.state === 'squash') continue;
      if (e.type === 'flower' ? e.rise < 0.2 : !e.active) continue;
      if (overlap(f, e)) { killEnemy(e, sign(f.vx), 200); boom = true; break; }
    }
    if (game.frame % 2 === 0) spawnP('spark', f.x + 8, f.y + 8, 1, { speed: 30, life: 0.25, size: 5, color: '#ffb030', g: 0 });
    if (boom) {
      spawnP('spark', f.x + 8, f.y + 8, 8, { speed: 190, life: 0.35, size: 6, color: '#ff7a2a', g: 300 });
      fireballs.splice(i, 1);
    } else if (f.x < cam.x - 60 || f.x > cam.x + W + 60 || f.y > H + 40) fireballs.splice(i, 1);
  }
}

// ---------- 6. Движущиеся платформы ----------
function updatePlatforms(dt) {
  for (const p of platforms) {
    p.t += dt;
    const k = 0.5 - 0.5 * Math.cos(p.t * (p.axis === 'h' ? 1.2 : 1.4));
    const nx = p.axis === 'h' ? p.x0 + p.range * k : p.x0, ny = p.axis === 'v' ? p.y0 - p.range * k : p.y0;
    p.dx = nx - p.x; p.dy = ny - p.y; p.x = nx; p.y = ny;
  }
}

// ---------- 7. Спуск в пень и пещера ----------
function tryEnterPipe() {
  const h = hero, from = area.name === 'main' ? warp.enter : warp.caveOut;
  if (!from || !h.onGround || !input.down) return false;
  if (Math.abs(h.x + h.w / 2 - from.x) > 26 || Math.abs(h.y + h.h - from.y) > 3) return false;
  h.state = 'pipe'; h.stateT = 0; h.vx = h.vy = 0; h.ride = null; h.crouch = false;
  if (h.power > 0 && h.h !== HERO_BIG) setHeroH(HERO_BIG);
  scene.pipe = { phase: 'in', toCave: area.name === 'main', cx: from.x, clipY: from.y };
  sfx('pipe');
  return true;
}
function updatePipe(dt) {
  const h = hero, p = scene.pipe; h.stateT += dt;
  if (p.phase === 'in') { // погружается в пень
    h.x += (p.cx - h.w / 2 - h.x) * Math.min(1, dt * 10);
    h.y += 105 * dt;
    if (h.stateT < 0.95) return;
    game.fade = 1; h.vx = h.vy = 0; fireballs.length = 0;
    if (p.toCave) { // падает с потолка пещеры
      h.x = warp.caveIn.x - h.w / 2; h.y = warp.caveIn.y; h.state = 'normal'; h.onGround = false;
      setArea('cave');
    } else { // вылезает из пня дальше по уровню
      h.x = warp.exit.x - h.w / 2; h.y = warp.exit.y; h.stateT = 0;
      p.phase = 'out'; p.clipY = warp.exit.y;
      setArea('main'); sfx('pipe');
    }
  } else {
    h.y -= 105 * dt;
    if (h.y + h.h <= p.clipY) { h.y = p.clipY - h.h; h.state = 'normal'; h.onGround = true; h.dir = 1; }
  }
}

// ---------- 8. Чекпоинт, флаг и финиш ----------
function grabFlag() {
  const h = hero;

  game.flagBonus = frac > 0.9 ? 5000 : frac > 0.65 ? 2000 : frac > 0.4 ? 800 : frac > 0.15 ? 400 : 100;
  h.state = 'flag'; h.stateT = 0; h.vx = h.vy = 0; h.dir = 1; h.star = 0; h.inv = 0; h.ride = null; h.crouch = false;
  if (h.power > 0 && h.h !== HERO_BIG) setHeroH(HERO_BIG);
  if (h.y < flag.topY) h.y = flag.topY;
  addScore(game.flagBonus, flag.x + 50, h.y + 10);
  game.time = Math.ceil(game.time);
  scene.phase = 0; scene.t = 0; scene.flagY = flag.topY + 8;
  fireballs.length = 0; sfx('flag');
}
function updateFinish(dt) {
  const h = hero; h.stateT += dt;

    const ty = flag.baseY - h.h, lowY = flag.baseY - 44;
    h.x += (flag.x - h.w + 4 - h.x) * Math.min(1, dt * 14);
    if (scene.phase === 0) { // съезжает по шесту вместе с флагом
      h.y = h.y < ty ? Math.min(ty, h.y + 300 * dt) : Math.max(ty, h.y - 300 * dt);
      scene.flagY = Math.min(lowY, scene.flagY + 300 * dt);
      if (h.y === ty && scene.flagY >= lowY) { scene.phase = 1; scene.t = 0; }
    } else if ((scene.t += dt) > 0.35) { // спрыгивает и идёт к норке
      h.state = 'win'; h.stateT = 0; scene.phase = 0; scene.t = 0; h.vy = -380; h.onGround = false;
    }
    return;
  }
  // h.state === 'win'
  h.vx = scene.phase === 0 ? 170 : 0; h.dir = 1;
  h.vy = Math.min(h.vy + PHYS.grav * dt, PHYS.maxFall);
  moveBody(h, dt);
  if (scene.phase === 0) {
    h.runPhase += 170 * dt * 0.05;
    if (h.x + h.w / 2 >= flag.houseX) { scene.phase = 1; scene.t = 0; sfx('win'); }
  } else if (scene.phase === 1) { // победная поза, салют и подсчёт очков за время
    scene.t += dt;
    if (game.frame % 18 === 0)

        { speed: 230, life: 0.8, size: 7, g: 220, color: `hsl(${Math.floor(rnd(0, 360))},100%,65%)` });
    if (scene.t > 0.8) {
      if (game.time > 0) {
        const d = Math.min(game.time, 2);
        game.time -= d; game.timeBonus += d * 50; game.score += d * 50;
        if (game.frame % 4 === 0) sfx('tick');
      } else { scene.phase = 2; scene.t = 0; }

  }
}
function checkTriggers() { // только для hero.state === 'normal'
  const h = hero;

  if (!checkpoint.active && h.x + h.w / 2 > checkpoint.x) {

}

// ---------- 9. Атмосфера: листья днём, светлячки вечером, радужный шлейф звезды ----------
function updateAmbient() {
  const h = hero;
  if (h.star > 0 && h.state === 'normal' && game.frame % 2 === 0)
    spawnP('rainbow', h.x + h.w / 2 - h.dir * 8, h.y + h.h * rnd(0.15, 0.9), 1,

  if (area.name !== 'main' || game.frame % 12) return;
  const z = zoneOf(cam.x + W / 2);
  if (z <= 1) spawnP('leaf', cam.x + rnd(0, W + 200), -10, 1,

// ---------- 10. Шаг мира (вызывается из step() перед updateHero) ----------
function updateWorld(dt) {
  const h = hero;
  updatePlatforms(dt);
  for (const [k, t] of bumpAnim) { if (t - dt <= 0) bumpAnim.delete(k); else bumpAnim.set(k, t - dt); }
  if (h.state === 'pipe') updatePipe(dt);
  else if (h.state === 'flag' || h.state === 'win') updateFinish(dt);
  else if (h.state === 'normal') checkTriggers();
  updateItems(dt);
  updateEnemies(dt);
  updateFireballs(dt);
  updateAmbient();
}

const TAU = Math.PI * 2;

}

function dropShadow(cx, footY, rx) { // мягкая тень на ближайшей опоре под объектом
  const tx = Math.floor(cx / TILE);
  for (let ty = Math.floor((footY - 1) / TILE) + 1; ty < ROWS; ty++) if (solidAt(tx, ty)) {

}

// ---------- 3. Тайлы ----------
const BRICK_ROWS = [[2, 21, 25, 21], [2, 9, 13, 22, 37, 9], [2, 21, 25, 21]];

  ell(x + 8 + n * 30, y + 16 + hash(n * 99) * 22, 4 + n * 4, 3 + n * 2, cave ? 'rgba(20,10,40,0.25)' : 'rgba(70,35,12,0.22)');

function drawTiles(ox) {

function env(vol, t0, dur) { // огибающая громкости
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  g.connect(master); return g;
}
function tone(f, dur, type, vol, delay, slide) {
  if (!actx || game.muted) return;
  const t0 = actx.currentTime + (delay || 0), o = actx.createOscillator();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  o.connect(env(vol, t0, dur)); o.start(t0); o.stop(t0 + dur + 0.03);
}
function noise(dur, vol, delay) {
  if (!actx || game.muted || !noiseBuf) return;
  const t0 = actx.currentTime + (delay || 0), s = actx.createBufferSource();
  s.buffer = noiseBuf; s.connect(env(vol, t0, dur)); s.start(t0); s.stop(t0 + dur + 0.03);
}
const seq = (ns, d, type, vol) => ns.forEach((f, i) => { if (f) tone(f, d * 1.5, type, vol, i * d); });
const SFX = {
  jump: () => tone(300, 0.17, 'square', 0.1, 0, 640),
  bump: () => tone(150, 0.1, 'square', 0.14, 0, 80),
  break: () => { noise(0.2, 0.25); tone(120, 0.16, 'sawtooth', 0.1, 0, 50); },
  coin: () => { tone(988, 0.08, 'square', 0.09); tone(1319, 0.28, 'square', 0.09, 0.07); },
  sprout: () => seq([262, 330, 392, 523, 659], 0.05, 'square', 0.09),
  power: () => seq([392, 523, 659, 494, 659, 784, 587, 784, 988], 0.055, 'square', 0.1),
  star: () => seq([659, 784, 988, 1319, 988, 1319, 1568], 0.06, 'triangle', 0.16),
  life: () => seq([659, 784, 1319, 1047, 1175, 1568], 0.09, 'square', 0.1),
  stomp: () => tone(440, 0.11, 'square', 0.13, 0, 150),
  kick: () => tone(560, 0.08, 'square', 0.12, 0, 240),
  fire: () => tone(760, 0.1, 'sawtooth', 0.08, 0, 180),
  pipe: () => seq([220, 165, 123, 220, 165, 123], 0.1, 'sawtooth', 0.09),
  checkpoint: () => seq([523, 659, 784, 1047], 0.08, 'triangle', 0.16),
  flag: () => tone(280, 0.9, 'square', 0.09, 0, 1200),
  win: () => seq([523, 659, 784, 1047, 0, 784, 1047, 1319, 1568], 0.11, 'square', 0.11),
  tick: () => tone(1500, 0.03, 'square', 0.04),
  hurt: () => tone(420, 0.3, 'sawtooth', 0.13, 0, 90),
  die: () => seq([494, 466, 440, 392, 330, 262, 196], 0.11, 'square', 0.11)
};
function playSfx(name) {
  const f = SFX[name];
  if (f && actx && !game.muted) { try { f(); } catch (e) { /* звук не критичен */ } }
}
function applyMute() { if (master) master.gain.value = game.muted ? 0 : 0.5; }

// ---------- 2. Музыка: мелодия + бас + «хэт», планировщик с упреждением ----------
const MEL = [72, 0, 76, 79, 0, 76, 79, 0, 81, 0, 79, 76, 0, 72, 74, 0, 77, 0, 76, 74, 0, 72, 74, 76, 79, 0, 0, 76, 74, 72, 0, 0,
  72, 0, 76, 79, 0, 76, 79, 0, 84, 0, 83, 81, 0, 79, 81, 0, 77, 79, 81, 0, 79, 77, 76, 0, 74, 0, 79, 0, 72, 0, 0, 0];
const BASS = [48, 45, 41, 43, 48, 45, 41, 43];
const midi = m => 440 * Math.pow(2, (m - 69) / 12);
function updateMusic() {
  if (!actx || game.muted) return;
  const on = game.mode === 'play' && (hero.state === 'normal' || hero.state === 'pipe');
  if (!on) { musNext = 0; if (game.mode !== 'pause') musStep = 0; return; }
  const now = actx.currentTime, tr = area.name === 'cave' ? -5 : 0;
  const d = hero.star > 0 ? 0.1 : game.time < 50 ? 0.125 : 0.155; // звезда и нехватка времени ускоряют темп
  if (musNext < now) musNext = now + 0.05;
  try {
    while (musNext < now + 0.25) {
      const i = musStep % 64, m = MEL[i], dl = musNext - now, root = i >= 60 ? 48 : BASS[i >> 3];
      if (m) tone(midi(m + tr), d * 1.7, 'square', 0.045, dl);
      if (i % 2 === 0) tone(midi(root + (i % 4 ? 7 : 0) + tr), d * 1.8, 'triangle', 0.11, dl);
      else noise(0.03, 0.03, dl);
      musNext += d; musStep++;
    }
  } catch (e) { musNext = 0; }
}

// ---------- 3. Управление экранами ----------
function onAnyKey(code) { // true = нажатие поглощено экраном
  initAudio();
  if (code === 'KeyM' || /^(F\d+|Meta|Control|Alt|Tab|OS)/.test(code)) return false;
  const m = game.mode, ptr = code === 'Touch' || code === 'Mouse';
  if (m === 'menu') { if (game.modeT > 0.3) newGame(false); return true; }
  if (m === 'over' || m === 'win') {
    if (code === 'KeyR') return false; // R — сразу новая игра (обрабатывает часть 1)
    if (game.modeT > 0.8) { game.checkpoint = false; game.demo = false; resetLevel(false); setMode('menu'); }
    return true;
  }
  if (m === 'pause' && ptr) { setMode('play'); return true; }
  return false;
}
function updateMeta(dt) {
  if (game.mode !== 'play' && game.mode !== 'pause') hero.t += dt; // герой «дышит» на экранах
  updateMusic();
}

// ---------- 4. Помощники интерфейса ----------
function txt(s, x, y, size, fill, align, stroke) {
  ctx.font = `bold ${size}px Verdana, sans-serif`; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size * 0.16); ctx.strokeStyle = stroke || '#2a1a3a'; ctx.strokeText(s, x, y);
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function tri(x, y, r, a) {
  ctx.beginPath();
  for (let i = 0; i < 3; i++) ctx.lineTo(x + Math.cos(a + i * TAU / 3) * r, y + Math.sin(a + i * TAU / 3) * r);
  ctx.closePath(); ctx.fill();
}
function dim(a) { ctx.fillStyle = `rgba(14,10,34,${a})`; ctx.fillRect(0, 0, W, H); }
const fmtScore = n => String(Math.round(n)).padStart(6, '0');

// ---------- 5. HUD: жизни, монеты, очки, время ----------
function drawHUD(now) {
  const pill = (x, w) => fillRR(x, 18, w, 48, 24, 'rgba(20,16,44,0.45)');
  pill(24, 150); drawFox(60, 61, { power: 0, pose: 'idle', t: now, scale: 0.8 });
  txt('× ' + game.lives, 88, 43, 26, '#fff', 'left');
  pill(190, 150); drawCoin(224, 42, 11, Math.cos(now * 4));
  txt('× ' + String(game.coins).padStart(2, '0'), 248, 43, 26, '#ffe680', 'left');
  pill(530, 220); txt(fmtScore(game.score), 640, 43, 30, '#fff');
  const low = game.mode === 'play' && game.time < 50 && Math.floor(now * 4) % 2;
  pill(1066, 150); ell(1098, 42, 14, 14, '#fff'); ell(1098, 42, 11, 11, '#3a2a5a'); // часы
  line(1098, 42, 1098, 34, '#fff', 2.5); line(1098, 42, 1104, 45, '#fff', 2.5);
  txt(String(Math.ceil(game.time)).padStart(3, '0'), 1122, 43, 28, low ? '#ff6a5a' : '#fff', 'left');
  if (hero.star > 0) { // полоска звезды
    fillRR(540, 74, 200, 10, 5, 'rgba(20,16,44,0.45)');
    fillRR(540, 74, Math.max(10, 200 * hero.star / 10), 10, 5, `hsl(${game.frame * 6 % 360},100%,65%)`);
  }
  if (game.muted) txt('звук выключен (M)', 640, hero.star > 0 ? 104 : 86, 16, '#d8d0f0');
}

// ---------- 6. Экраны: меню, пауза, проигрыш, победа ----------
function drawMenu(now, a) {
  dim(0.36);
  ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(0, 110, 0, 220); g.addColorStop(0, '#fff6b0'); g.addColorStop(1, '#ff8a1f');
  txt('ЛИСЁНОК', 640, 165 + Math.sin(now * 2) * 4, 104, g, 'center', '#3a1a10');
  txt('и огненный жёлудь', 640, 262, 50, '#ffe9c0', 'center', '#3a1a10');
  const ax = 1010, ay = 172 + Math.sin(now * 2 + 1) * 5, fl = 1 + Math.sin(now * 14) * 0.12; // огненный жёлудь
  ell(ax, ay - 30, 30 * fl, 40 * fl, 'rgba(255,120,30,0.3)'); ell(ax, ay - 30, 17, 28 * fl, '#ff7a1f'); ell(ax, ay - 22, 10, 17 * fl, '#ffd23e');
  ell(ax, ay + 10, 22, 26, '#ffc02e'); ell(ax - 7, ay + 6, 5, 11, 'rgba(255,255,255,0.55)');
  ctx.beginPath(); ctx.ellipse(ax, ay - 4, 25, 18, 0, Math.PI, 0); ctx.closePath(); ctx.fillStyle = '#b06a1e'; ctx.fill();
  if (game.hiscore > 0) txt('Рекорд: ' + fmtScore(game.hiscore), 640, 52, 24, '#ffe680');
  shadow(750, 627, 62, 0.3); // лисёнок бежит на месте и показывает три состояния
  drawFox(750, 624, { power: Math.floor(now / 2.5) % 3, pose: 'run', t: now, phase: now * 11, scale: 1.9, dir: 1 });
  ctx.globalAlpha = a * (0.55 + 0.45 * Math.sin(now * 5));
  txt('Нажми любую клавишу или коснись экрана', 640, 348, 30, '#fff');
  ctx.globalAlpha = a;
  txt('← → / A D — бег   ·   Пробел / W / ↑ — прыжок   ·   Shift — ускорение', 640, 658, 20, '#fff6e0');
  txt('X / F — огонёк   ·   ↓ — присесть и спуск в пень   ·   P — пауза   ·   M — звук   ·   R — рестарт', 640, 692, 20, '#fff6e0');
}
function drawPause(now, a) {
  dim(0.55 * a); ctx.globalAlpha = a;
  txt('ПАУЗА', 640, 300, 96, '#fff6b0', 'center', '#3a1a10');
  drawFox(640, 480, { power: hero.power, pose: 'idle', t: now, scale: 1.5 });
  txt(isTouch ? 'Коснись экрана, чтобы продолжить' : 'P — продолжить   ·   R — начать заново   ·   M — звук', 640, 550, 26, '#fff');
}
function drawOver(now, a) {
  dim(0.72 * a); ctx.globalAlpha = a;
  txt('ИГРА ОКОНЧЕНА', 640, 210, 84, '#ff7a6a', 'center', '#3a1010');
  drawFox(640, 400, { power: 0, pose: 'hurt', t: now * 0.4, scale: 2 });
  txt('Очки: ' + fmtScore(game.score), 640, 470, 38, '#fff');
  const rec = game.score > 0 && game.score >= game.hiscore;
  txt(rec ? 'Новый рекорд!' : 'Рекорд: ' + fmtScore(game.hiscore), 640, 524, 28, rec ? `hsl(${now * 200 % 360},100%,72%)` : '#ffe680');
  if (game.modeT > 0.8) {
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(now * 5);
    txt(isTouch ? 'Коснись экрана' : 'Любая клавиша — в меню   ·   R — ещё раз', 640, 610, 26, '#fff');
  }
}
function drawWin(now, a) {
  dim(0.4 * a); ctx.globalAlpha = a;
  const py = 120 + (1 - a) * 40; // панель мягко выезжает
  fillRR(300, py, 680, 480, 34, 'rgba(24,18,52,0.88)');
  rr(300, py, 680, 480, 34); ctx.strokeStyle = '#ffd23e'; ctx.lineWidth = 4; ctx.stroke();
  const g = ctx.createLinearGradient(0, py + 30, 0, py + 110); g.addColorStop(0, '#fff6b0'); g.addColorStop(1, '#ffa01f');
  txt('ПОБЕДА!', 640, py + 72, 72, g, 'center', '#3a1a10');
  const row = (label, val, y, c) => { txt(label, 350, y, 24, '#cfc6f0', 'left'); txt(val, 770, y, 26, c || '#fff', 'right'); };
  row('Бонус за флаг', '+' + Math.round(game.flagBonus), py + 160);
  row('Бонус за время', '+' + Math.round(game.timeBonus), py + 206);
  row('Монеты', '× ' + game.coins, py + 252, '#ffe680');
  line(350, py + 284, 770, py + 284, 'rgba(255,255,255,0.3)', 2);
  row('Итого очков', fmtScore(game.score), py + 318, '#fff6b0');
  row('Рекорд', fmtScore(game.hiscore), py + 364, '#ffe680');
  if (game.newRecord) {
    starPath(372, py + 412, 16, 7, now * 2); ctx.fillStyle = '#ffe14a'; ctx.fill();
    txt('НОВЫЙ РЕКОРД!', 400, py + 412, 28, `hsl(${now * 200 % 360},100%,72%)`, 'left');
  }
  shadow(872, py + 392, 44, 0.35);
  drawFox(872, py + 390, { power: hero.power, pose: 'win', t: now, scale: 1.5 });
  if (game.modeT > 0.8) {
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(now * 5);
    txt(isTouch ? 'Коснись экрана' : 'Любая клавиша — в меню   ·   R — ещё раз', 640, py + 448, 22, '#fff');
  }
}

// ---------- 7. Сенсорные кнопки ----------
function drawTouch() {
  const ANG = { left: Math.PI, right: 0, down: Math.PI / 2, jump: -Math.PI / 2 };
  for (const b of touchBtns) {
    ctx.globalAlpha = b.on ? 0.6 : 0.3; ell(b.x, b.y, b.r, b.r, '#1a1438');
    ctx.globalAlpha = b.on ? 0.95 : 0.6;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#fff';
    if (b.id === 'pause') { ctx.fillRect(b.x - 9, b.y - 11, 6, 22); ctx.fillRect(b.x + 3, b.y - 11, 6, 22); }
    else if (b.id === 'fire') { ell(b.x, b.y, 18, 18, '#ff7a1f'); ell(b.x + 3, b.y, 10, 10, '#ffe14a'); }
    else tri(b.x, b.y, b.r * 0.45, ANG[b.id]);
  }
  ctx.globalAlpha = 1;
}

// ---------- 8. Сборка интерфейса (вызывается в конце renderFrame) ----------
function drawUI() {
  const now = game.frame / 60, m = game.mode, a = Math.min(1, game.modeT * 3); // плавное появление экранов
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (m !== 'menu') drawHUD(now);
  if (m === 'menu') drawMenu(now, a);
  else if (m === 'pause') drawPause(now, a);
  else if (m === 'over') drawOver(now, a);
  else if (m === 'win') drawWin(now, a);
  ctx.globalAlpha = 1;
  if (isTouch && m === 'play') drawTouch();
}

// ---------- 9. Запуск ----------
requestAnimationFrame(loop);
</script></body></html>
